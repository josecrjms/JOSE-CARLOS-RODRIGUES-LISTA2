<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verificador de Idade</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Verificador de Idade</h1>

    <section>

        <div class="campo">

            <label for="ano">
                Ano de Nascimento:
            </label>

            <input
                type="number"
                id="ano"
                placeholder="Ex: 2005"
            >

        </div>


        <div class="campo">

            <span>Sexo:</span>

            <label>
                <input
                    type="radio"
                    name="sexo"
                    value="masculino"
                >
                Masculino
            </label>

            <label>
                <input
                    type="radio"
                    name="sexo"
                    value="feminino"
                >
                Feminino
            </label>

        </div>


        <button onclick="verificarIdade()">
            Verificar
        </button>


        <div id="resultado">

            <p id="mensagem">
                Preencha os dados acima.
            </p>

            <img
                id="foto"
                src=""
                alt="Imagem da pessoa"
            >

        </div>

    </section>


    <footer>
        © Uniderp
    </footer>


    <script src="script.js"></script>

</body>

</html>
